name: AccessTrail CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        run: uv sync

      - name: Run Backend Pytest Suite
        run: uv run pytest -v

      - name: Verify Tamper-Evident Audit Chain
        run: |
          uv run python -m backend.app.cli.main seed-demo
          uv run python -m backend.app.cli.main verify-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend & Typecheck
        working-directory: frontend
        run: npm run build
